<div class="card ml-4">             
    <div class="card-header">{{ animal.name }}</div>             
        <img src="assets/img/{{ animal.img }}"                   
        alt="animal thumbnail" class="card-img-top">             
    <div class="card-body">                 
        <h6 class="card-subtitle mb-2 text-muted">                      
            {{ animal.species }}                 
        </h6>                                 
        <p class="card-text" [innerHTML]="animal.description">
        </p>
        <div *ngIf="isLoggedIn()">
            <button (click)="editAnimal(animal)" class="btn btn-info">Edit Animal</button>
        </div>
    </div>
</div>
